# Test obligations this repository satisfies, and how.
#
# The meta-repository declares WHAT must be true (tests/contracts/test-taxonomy.toml,
# `obligations` per owner). This file declares HOW this repository proves it. The
# validator (`tools/owner_contracts.py`) runs these commands here and observes the
# result; it never learns this repository's test layout, so reorganising tests is
# a local change that breaks nothing upstream.
#
# ADR 0092 invariant 5: owner-local tests exercise implementation; the meta
# exercises public interfaces. This file is the seam between those two.

schema_version = 1
owner = "abir"

[obligation.owner-tests]
description = """
The ABIR biosignal core: store, BCS wire format, adapters, conformance and
the training window store.
"""
argv = ["cargo", "test", "--workspace", "--no-fail-fast"]
timeout_seconds = 1200

# EXPECTED BEHAVIOUR, not a defect: this obligation goes RED whenever the abir
# checkout is dirty. `crates/abir-python/build.rs` fail-closes with "cannot
# establish ABIR implementation revision: ABIR source checkout is dirty" rather
# than stamping a build it cannot identify. Adding this very file tripped it
# (exit 101 in 0.2s, before a single test ran).
#
# Left as is. A wire-format producer refusing to mint a production identity from
# uncommitted sources is the guard working; teaching the validator to set
# ABIR_DEVELOPMENT_BUILD=1 would route every run around it and quietly make the
# non-production identity the normal one. Commit your abir work, then ask.

# RATCHET, not a waiver. Measured 2026-08-10: 224 passed, 0 failed.
#
# Declared at 0 because 0 is what was measured. A ceiling above a green suite is
# permission to regress, and the ratchet only means something when it is tight.
max_failures = 0

# What this command does NOT cover. Printed by the validator on every run,
# including passing ones — an obligation that answers `ok` while a whole tree
# goes unasked reads as full coverage.
scope_note = """
The 4 Python test files under python/tests are not run: they import `abir`,
which is not installed in a bare checkout (2 collection errors). Tracked.
"""
